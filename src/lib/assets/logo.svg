<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Film strip body - rounded rectangle with perforations -->
  <rect x="80" y="100" width="352" height="312" rx="40" ry="40" fill="url(#grad1)"/>

  <!-- Film perforations - left column -->
  <rect x="104" y="136" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="104" y="176" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="104" y="216" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="104" y="256" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="104" y="296" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="104" y="336" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="104" y="376" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>

  <!-- Film perforations - right column -->
  <rect x="380" y="136" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="380" y="176" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="380" y="216" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="380" y="256" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="380" y="296" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="380" y="336" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>
  <rect x="380" y="376" width="28" height="20" rx="4" fill="#1a1a26" opacity="0.5"/>

  <!-- Inner screen area -->
  <rect x="152" y="136" width="208" height="240" rx="16" fill="#1a1a26" opacity="0.4"/>

  <!-- Play triangle / projector beam -->
  <path d="M228 196 L228 320 L332 258 Z" fill="white" opacity="0.9"/>

  <!-- Aurora glow arcs above -->
  <path d="M160 100 Q256 40 352 100" stroke="url(#grad2)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M130 90 Q256 16 382 90" stroke="url(#grad2)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
